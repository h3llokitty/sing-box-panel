<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Import sing-box profile</title>
  <style>
    :root { font: 16px/1.45 system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { box-sizing: border-box; width: min(92vw, 34rem); padding: 2rem; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 1.5rem; }
    h1 { margin: 0 0 .75rem; font-size: 1.6rem; }
    p { margin: .65rem 0; }
    button, a.action { box-sizing: border-box; display: block; width: 100%; margin-top: .75rem; padding: .85rem 1rem; border: 0; border-radius: .8rem; font: inherit; font-weight: 650; text-align: center; text-decoration: none; cursor: pointer; }
    #open { background: #1478ff; color: white; }
    .secondary { background: color-mix(in srgb, CanvasText 10%, Canvas); color: CanvasText; }
    #fallback[hidden], #error[hidden] { display: none; }
    #status { opacity: .75; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Add VPN profile</h1>
    <p id="profile"></p>
    <p id="status">Opening VPN app…</p>
    <button id="open" type="button">Open VPN app</button>
    <section id="fallback" hidden>
      <p id="fallbackText">If the app did not open, install a compatible VPN app or use one of the manual options.</p>
      <button id="copyImport" class="secondary" type="button">Copy import link</button>
      <button id="copyProfile" class="secondary" type="button">Copy profile URL</button>
      <a id="install" class="action secondary" href="https://sing-box.sagernet.org/clients/">Install VPN app</a>
    </section>
    <p id="error" hidden></p>
  </main>
  <script>
    (() => {
      'use strict';
      const ru = (navigator.language || '').toLowerCase().startsWith('ru');
      const text = ru ? {
        title: 'Добавить VPN-профиль', opening: 'Открываю VPN-приложение…', open: 'Открыть VPN-приложение',
        fallback: 'Если приложение не открылось, установите совместимое VPN-приложение или воспользуйтесь ручным вариантом.',
        copyImport: 'Скопировать ссылку импорта', copyProfile: 'Скопировать URL профиля', install: 'Установить VPN-приложение',
        copied: 'Скопировано', invalid: 'Некорректная ссылка профиля.'
      } : {
        title: 'Add VPN profile', opening: 'Opening VPN app…', open: 'Open VPN app',
        fallback: 'If the app did not open, install a compatible VPN app or use one of the manual options.',
        copyImport: 'Copy import link', copyProfile: 'Copy profile URL', install: 'Install VPN app',
        copied: 'Copied', invalid: 'Invalid profile link.'
      };
      const byId = id => document.getElementById(id);
      document.documentElement.lang = ru ? 'ru' : 'en';
      document.title = text.title;
      byId('title').textContent = text.title;
      byId('status').textContent = text.opening;
      byId('open').textContent = text.open;
      byId('fallbackText').textContent = text.fallback;
      byId('copyImport').textContent = text.copyImport;
      byId('copyProfile').textContent = text.copyProfile;
      byId('install').textContent = text.install;

      const ua = navigator.userAgent || '';
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        byId('install').href = 'https://apps.apple.com/ru/app/speed-bunny/id6670149712?l=en-GB';
      } else if (isAndroid) {
        byId('install').href = 'https://play.google.com/store/apps/details?id=io.nekohasekai.sfa&utm_source=emea_Med';
      }

      const match = location.pathname.match(/^\/import\/([A-Za-z0-9_]+)\/?$/);
      if (!match) {
        byId('status').hidden = true;
        byId('open').hidden = true;
        byId('error').hidden = false;
        byId('error').textContent = text.invalid;
        return;
      }
      const key = match[1];
      let name = key;
      try { if (location.hash.length > 1) name = decodeURIComponent(location.hash.slice(1)); } catch (_) {}
      const profileUrl = `${location.origin}/${key}.json`;
      const importScheme = isIOS ? 'speed-bunny' : 'sing-box';
      const importUrl = `${importScheme}://import-remote-profile?url=${encodeURIComponent(profileUrl)}#${encodeURIComponent(name)}`;
      byId('profile').textContent = name;

      let leftPage = false;
      const markOpened = () => { leftPage = true; };
      document.addEventListener('visibilitychange', () => { if (document.hidden) markOpened(); });
      window.addEventListener('pagehide', markOpened);
      window.addEventListener('blur', markOpened);

      const showFallback = () => {
        if (!leftPage) {
          byId('status').hidden = true;
          byId('fallback').hidden = false;
        }
      };
      const launch = () => {
        leftPage = false;
        byId('status').hidden = false;
        byId('status').textContent = text.opening;
        location.href = importUrl;
        window.setTimeout(showFallback, 1800);
      };
      const copy = async (value, button) => {
        try {
          await navigator.clipboard.writeText(value);
          const old = button.textContent;
          button.textContent = text.copied;
          window.setTimeout(() => { button.textContent = old; }, 1400);
        } catch (_) {
          window.prompt(button.textContent, value);
        }
      };
      byId('open').addEventListener('click', launch);
      byId('copyImport').addEventListener('click', event => copy(importUrl, event.currentTarget));
      byId('copyProfile').addEventListener('click', event => copy(profileUrl, event.currentTarget));

      const marker = `sb-import:${key}`;
      const lastAttempt = Number(sessionStorage.getItem(marker) || 0);
      if (Date.now() - lastAttempt > 10000) {
        sessionStorage.setItem(marker, String(Date.now()));
        window.setTimeout(launch, 150);
      } else {
        showFallback();
      }
    })();
  </script>
</body>
</html>
